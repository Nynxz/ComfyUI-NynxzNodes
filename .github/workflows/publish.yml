name: Publish to Comfy registry
on:
    workflow_dispatch:
    push:
        branches:
            - main
            - master
        paths:
            - "pyproject.toml"

permissions:
    issues: write

jobs:
    publish-node:
        name: Publish Custom Node to registry
        runs-on: ubuntu-latest
        if: ${{ github.repository_owner == 'Nynxz' }}
        steps:
            - name: Check out code
              uses: actions/checkout@v4
              with:
                  submodules: true
            - uses: pnpm/action-setup@v4
              with:
                  version: 11
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            # The registry package ships web/, so build it here rather than relying on a
            # committed bundle.
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: test -f web/main.js

            # web/ is gitignored, and the registry archive only contains git-tracked files —
            # staging it is what puts the bundle in the package. Never committed.
            - run: git add -f web

            - name: Publish Custom Node
              uses: Comfy-Org/publish-node-action@v1
              with:
                  personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
