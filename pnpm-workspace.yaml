# pnpm rejects dependencies published within the last 24h as a supply-chain guard. These two are
# ours, published from ZenKit's own CI, so the waiting period protects against nothing here.
minimumReleaseAgeExclude:
  - '@nynxz/zenkit-ui'
  - '@nynxz/zenkit-nodekit'

# The Fresco editor needs ZenBoxCanvas/ZenLayerList, useWheelClaim and readMediaDrop's URL upload,
# which are on ZenKit's feat/box-canvas and not released yet. Drop this once @nynxz/zenkit-ui ships them and the dependency is bumped.
overrides:
  '@nynxz/zenkit-ui': link:/home/user/git/nynxz/comfyui_nodepacks/ZenKit/packages/ui
  '@nynxz/zenkit-nodekit': link:/home/user/git/nynxz/comfyui_nodepacks/ZenKit/packages/nodekit
